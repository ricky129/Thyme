services:
  thyme:
    build:
      context: .
      dockerfile: Dockerfile
    image: thyme:local
    container_name: thyme
    restart: unless-stopped
    init: true
    pid: host
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
      - /run/thyme-jna:rw,nosuid,nodev,exec,size=16m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /usr/bin/sleep
    command:
      - infinity
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
      - type: bind
        source: /sys
        target: /sys
        read_only: true
